server.port=8080

# Conexión a tu base de datos MySQL local
spring.datasource.url=${MERY_DB_URL:jdbc:mysql://localhost:3306/merysalud_db?serverTimezone=UTC}
spring.datasource.username=${MERY_DB_USER:merysalud}
spring.datasource.password=${MERY_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
mery.jwt.secret=${MERY_JWT_SECRET}
mery.frontend.origins=${MERY_FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}
mery.seed.demo=${MERY_SEED_DEMO:false}
